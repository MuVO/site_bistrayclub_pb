label="Увеличить количество игроков" class="w-12 h-12 rounded-xl bg-white/5 border border-white/15 flex items-center justify-center text-white hover:bg-white/10 hover:border-neon-green/30 transition-all duration-300 active:scale-95"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus w-5 h-5"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button></div><p class="text-xs text-gray-500 mt-2">Минимум {{MIN_PLAYERS}} игроков для бронирования</p></div><div class="rounded-2xl p-6 bg-neon-green/5 border border-neon-green/20"><div class="flex items-center justify-between mb-2"><span class="text-sm text-gray-400">{{MIN_PLAYERS}}<!-- --> x <!-- -->{{PRICE_PER_PLAYER}}<!-- -->₽</span></div><div class="flex items-center justify-between"><span class="text-lg text-gray-300 font-medium">Итого:</span><span class="font-heading text-3xl font-bold text-neon-green">{{TOTAL_PRICE}}<!-- -->₽</span></div></div><button class="inline-flex items-center justify-center whitespace-nowrap ring-offset-background focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none rounded-md px-8 w-full h-14 bg-neon-green hover:bg-neon-green/90 text-black font-heading font-bold text-lg animate-float-glow transition-all duration-300 hover:scale-[1.02] active:scale-[0.98] disabled:opacity-50 disabled:hover:scale-100" type="submit" disabled="">Забронировать игру</button></form></div></section>
